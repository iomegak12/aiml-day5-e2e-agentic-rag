<script>
    // Visibility toggle functionality for API Key field
    const apiKeyField = document.getElementById('apiKeyField');
    const toggleVisibilityBtn = document.getElementById('toggleVisibilityBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleVisibilityBtn && apiKeyField && eyeIcon) {
      toggleVisibilityBtn.addEventListener('click', () => {
        const isPassword = apiKeyField.type === 'password';
        apiKeyField.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Role preset selection simulator
    function selectUser(userKey, element) {
      const allCards = document.querySelectorAll('.user-card');
      allCards.forEach(c => {
        c.classList.remove('selected', 'ring-2', 'ring-on-secondary-fixed', 'ring-offset-1');
      });

      element.classList.add('selected', 'ring-2', 'ring-on-secondary-fixed', 'ring-offset-1');
      
      const keyMap = {
        alice: 'nca_live_guest_820fa94bc21703e',
        bob: 'nca_live_emp_99d14f4e19bce8a204fa671',
        carol: 'nca_live_adm_44ae12cc80e227dfa8b'
      };

      if (apiKeyField && keyMap[userKey]) {
        apiKeyField.value = keyMap[userKey];
      }
    }
  </script>

# Security headers. Note: a location with its own add_header does not inherit these, so locations that add
# headers include this file again.
#
# Strict CSP: everything (scripts, styles, fonts) is self-hosted by the Vite build; the API is same-origin.
# Inline styles set by React through the CSSOM (style={{...}}) are not affected by style-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

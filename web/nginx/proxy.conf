# Shared reverse-proxy settings for the API locations.
proxy_http_version 1.1;
proxy_set_header Connection "";                 # keep-alive to the upstream

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (never append): the API trusts the left-most X-Forwarded-For when TRUST_PROXY_HEADERS=true,
# so a client-supplied header must not survive this hop.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Server-Sent Events: no buffering, and room for the longest agent run (300 s max + grace).
proxy_buffering off;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_send_timeout 330s;
proxy_read_timeout 330s;

# NetCore Assist web gateway (nginxinc/nginx-unprivileged: non-root, listens on 8080).
# Serves the React build and reverse-proxies the API on the same origin, so the browser never talks to
# api:8080 directly and no CORS is needed. Routes: /api/*, /health, /ready -> API; everything else -> SPA.
# /metrics, /docs, /redoc and /openapi.json are deliberately NOT proxied.

upstream netcore_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;   # AskRequest is tiny (question <= 2000 chars)

    # gzip for static assets and JSON; text/event-stream is not in the list, so SSE is never compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Container healthcheck (does not depend on the API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- API (same origin)
    location /api/ {
        proxy_pass http://netcore_api;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /health {
        proxy_pass http://netcore_api;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /ready {
        proxy_pass http://netcore_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---------------------------------------------------------------- SPA
    # Vite emits content-hashed files under /assets: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deployment is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (/requests, /runs/:id, ...) fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
